const es=n=>{if(n<=15)return[esn[n-1],esa[n-1]];if(n==100)return["cien","سيين"];if(n==20)return["veinte","بيينتي"];const u=n%10;if(n<30)return[(n<20?"dieci":"veinti")+(acc[u]||esn[u-1]),(n<20?"دييسي":"بيينتي")+esa[u-1]];const t=(n/10|0)-3;return[est[t]+(u?" y "+esn[u-1]:""),esta[t]+(u?" إي "+esa[u-1]:"")]};
const G={ko:mk(",일,이,삼,사,오,육,칠,팔,구".split(","),",إيل,إي,سام,سا,أو,يوك,تشيل,بال,غو".split(","),"십","شيب","백","بايك"),zh:mk(",一,二,三,四,五,六,七,八,九".split(","),",ي,أر,سان,سه,وو,ليو,تشي,با,جيو".split(","),"十","شي","一百","ي باي"),ja:mk(",一,二,三,四,五,六,七,八,九".split(","),",إيتشي,ني,سان,يون,غو,روكو,نانا,هاتشي,كيو".split(","),"十","جو","百","هياكو"),en,fr:n=>{const s=fr(n);return[s,s.split(/[ -]/).map(w=>frm[w]).join(" ")]},es};
const NUM={};for(const k in G)NUM[k]=Array.from({length:100},(_,j)=>G[k](j+1));
let lang="ko",tab="learn",i=0,flipped=false,q=null,score=0,asked=0,wrong={};
try{wrong=JSON.parse(localStorage.getItem("wrong")||"{}")}catch(e){}
const $=s=>document.querySelector(s),view=$("#view");
const save=()=>{try{localStorage.setItem("wrong",JSON.stringify(wrong))}catch(e){}};
const words=()=>L[lang].w;
function speak(t){
  if(!("speechSynthesis" in window)){alert("المتصفح لا يدعم النطق الصوتي");return}
  speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang=L[lang].v;u.rate=.85;speechSynthesis.speak(u);
}
function chips(){
  $("#langs").innerHTML=Object.keys(L).map(k=>`<button class="chip" data-l="${k}" aria-pressed="${k===lang}">${L[k].n}</button>`).join("");
}
function learn(){
  const w=words()[i];
  view.innerHTML=`<div class="meta"><span>${i+1} / ${words().length}</span><span>اضغط البطاقة لإظهار المعنى</span></div>
  <div class="bar"><i style="width:${(i+1)/words().length*100}%"></i></div>
  <div class="card" id="card" tabindex="0" role="button" aria-label="اقلب البطاقة">
    <div class="word">${w[0]}</div><div class="pron">${w[1]}</div>
    ${flipped?`<div class="meaning">${w[2]}</div>${w[3]?`<div class="ex">${w[3]}</div><div class="exm">${w[4]||""}</div>`:""}`:`<div class="hint">؟</div>`}
    <button class="speak" id="say">🔊 استمع</button>
  </div>
  <div class="row"><button class="btn" id="prev">السابق</button><button class="btn main" id="next">التالي</button></div>
  <button class="btn" id="more" style="width:100%;margin-top:10px">✨ كلمات جديدة من سويونغ</button>`;
  $("#card").onclick=e=>{if(e.target.id==="say"){speak(w[0]);return}flipped=!flipped;learn()};
  $("#card").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flipped=!flipped;learn()}};
  $("#prev").onclick=()=>{i=(i-1+words().length)%words().length;flipped=false;learn()};
  $("#next").onclick=()=>{i=(i+1)%words().length;flipped=false;learn()};
  $("#more").onclick=e=>moreWords(e.currentTarget);
}
function nextQ(){
  const ws=words(),w=ws[Math.floor(Math.random()*ws.length)];
  const others=[...new Set(ws.map(x=>x[2]).filter(m=>m!==w[2]))].sort(()=>Math.random()-.5).slice(0,3);
  q={w,opts:[...others,w[2]].sort(()=>Math.random()-.5),done:false};quiz();
}
function quiz(){
  if(!q)return nextQ();
  view.innerHTML=`<div class="meta"><span>النتيجة: ${score} / ${asked}</span><span>ما معنى هذه الكلمة؟</span></div>
  <div class="card"><div class="word">${q.w[0]}</div><div class="pron">${q.w[1]}</div>
  <button class="speak" id="say">🔊 استمع</button>
  <div class="opts">${q.opts.map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join("")}</div></div>
  <div class="row">${q.done?'<button class="btn main" id="nq">السؤال التالي</button>':""}</div>`;
  $("#say").onclick=()=>speak(q.w[0]);
  view.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(q.done)return;q.done=true;asked++;
    const ok=b.dataset.o===q.w[2],key=lang+"|"+q.w[0];
    if(ok){score++;if(wrong[key]){delete wrong[key]}}else{wrong[key]=1}
    save();quiz();
    view.querySelectorAll(".opt").forEach(x=>{if(x.dataset.o===q.w[2])x.classList.add("ok");else if(x===undefined);});
    view.querySelectorAll(".opt").forEach(x=>{if(!ok&&x.dataset.o===b.dataset.o)x.classList.add("no")});
  });
  if(q.done){view.querySelectorAll(".opt").forEach(x=>{if(x.dataset.o===q.w[2])x.classList.add("ok")});$("#nq").onclick=nextQ}
}
function review(){
  const items=Object.keys(wrong).map(k=>{const[l,t]=k.split("|");const w=L[l].w.find(x=>x[0]===t);return w?{l,w}:null}).filter(Boolean);
  view.innerHTML=`<div class="card">${items.length?`<div class="meaning" style="color:var(--rose)">كلمات تحتاج مراجعة</div>
  <ul class="list">${items.map(x=>`<li><span class="w">${x.w[0]}</span><span>${x.w[2]} · ${L[x.l].n}</span></li>`).join("")}</ul>
  <button class="btn" id="clr" style="width:100%;margin-top:14px">مسح القائمة</button>`:
  `<div style="font-size:2.5rem">✨</div><div class="meaning">لا توجد أخطاء بعد</div><div class="hint">الكلمات التي تخطئ فيها في الاختبار تظهر هنا لتراجعها.</div>`}</div>`;
  const c=$("#clr");if(c)c.onclick=()=>{wrong={};save();review()};
}
const SYS=()=>`أنتِ «سويونغ»، معلّمة لغات ودودة وذكية وواسعة المعرفة. اللغة التي يتعلمها الطالب الآن: ${L[lang].n}. تجيبين عن أي سؤال في أي موضوع، حتى خارج اللغات، بوضوح ودفء. الافتراضي: الرد بالعربية. عند الحديث عن لغة أجنبية اكتبي الكلمة بكتابتها الأصلية ثم نطقها بالحروف العربية ثم معناها، وصحّحي أخطاء الطالب بلطف مع الشرح. اجعلي الردود مرتبة ومختصرة، مع إيموجي باعتدال. الردود تُقرأ بصوت عالٍ أحيانًا فتجنّبي الجداول والرموز الكثيرة.`;
let chat=[],busy=false,sm=null;
async function getSample(){
  if(sm)return sm;
  const post=async(u,b)=>{const r=await fetch(u,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(b)});const d=await r.json().catch(()=>({}));if(!r.ok)throw{code:r.status===429?"rate_limited":"error"};return d};
  sm=h=>post("/api/chat",{messages:h,lang:L[lang].n});
  sm.json=async p=>(await post("/api/json",{prompt:p})).data;
  return sm}
const fmt=t=>t.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/\n/g,"<br>");
function chatView(){
  const sug=["كيف أقول «أحبك» بالكورية؟","علّمني 5 كلمات عن الطعام","ما الفرق بين الصينية واليابانية؟","اشرح لي كيف تعمل الطائرات ببساطة"];
  view.innerHTML=`<div class="chat" id="msgs">${chat.length?chat.map(m=>`<div class="b ${m.r}">${fmt(m.c)}</div>`).join(""):`<div class="empty"><div class="em">🌸</div><p>اسألني عن أي لغة، أو عن أي شيء آخر.<br>أنا هنا لأشرح وأصحّح وأتحدث معك.</p></div>`}</div>
  ${chat.length?"":`<div class="sugg">${sug.map(s=>`<button class="sg">${s}</button>`).join("")}</div>`}
  <div class="compose"><input id="inp" placeholder="اكتب أو تحدّث…" aria-label="رسالتك" autocomplete="off"><button class="mic" id="mic" aria-label="تحدّث">🎤</button><button class="btn main" id="snd">إرسال</button></div>
  <div class="sugg"><button class="ch" id="vo">${voiceOn?"🔊 الرد الصوتي: يعمل":"🔇 الرد الصوتي: متوقف"}</button><button class="ch" id="ml">🎤 أتحدث بـ${micAr?"العربية":L[lang].n}</button></div>`;
  const m=$("#msgs");m.scrollTop=m.scrollHeight;
  const go=()=>{const v=$("#inp").value;$("#inp").value="";send(v)};
  $("#snd").onclick=go;$("#inp").onkeydown=e=>{if(e.key==="Enter")go()};
  $("#mic").onclick=toggleMic;setL(listening);
  $("#vo").onclick=e=>{voiceOn=!voiceOn;if(!voiceOn)speechSynthesis.cancel();e.currentTarget.textContent=voiceOn?"🔊 الرد الصوتي: يعمل":"🔇 الرد الصوتي: متوقف"};
  $("#ml").onclick=e=>{micAr=!micAr;e.currentTarget.textContent="🎤 أتحدث بـ"+(micAr?"العربية":L[lang].n)};
  view.querySelectorAll(".sg").forEach(b=>b.onclick=()=>send(b.textContent));
}
async function send(t){
  t=t.trim();if(!t||busy)return;
  const s=await getSample();chat.push({r:"u",c:t});
  if(!s){chat.push({r:"a",c:"المحادثة الذكية غير متاحة في هذا العرض. افتح الصفحة من حسابك في Claude."});chatView();return}
  busy=true;chat.push({r:"a",c:"…"});chatView();
  let h=chat.slice(0,-1).slice(-12).map(m=>({role:m.r==="u"?"user":"assistant",content:m.c}));
  while(h.length&&h[0].role!=="user")h.shift();
  
  const last=chat[chat.length-1];
  try{
    const r=await s(h,{cache:false,onText:({text})=>{last.c=text;const b=document.querySelector("#msgs .b:last-child");if(b){b.innerHTML=fmt(text);b.parentNode.scrollTop=b.parentNode.scrollHeight}}});
    last.c=r.text||"…";
    if(voiceOn)speakMixed(last.c);
  }catch(e){
    last.c=e&&e.code==="not_granted"?"لم تتم الموافقة على استخدام المحادثة.":e&&e.code==="rate_limited"?"الطلبات كثيرة الآن، انتظر قليلًا ثم حاول مجددًا.":"تعذّر الرد، حاول مرة أخرى.";
  }
  busy=false;if(tab==="chat")chatView();
}
async function moreWords(btn){
  const s=await getSample();
  if(!s){btn.textContent="غير متاح في هذا العرض";return}
  btn.disabled=true;btn.textContent="سويونغ تجهّز كلماتك…";
  const have=words().map(w=>w[0]).join("، ");
  try{
    const a=await s.json(`أعطني 8 كلمات جديدة ومفيدة في اللغة ${L[lang].n} (مبتدئ إلى متوسط ومن مواضيع متنوعة) غير هذه: ${have}. أعد مصفوفة JSON فقط، كل عنصر مصفوفة من 5 نصوص بالترتيب: الكلمة بكتابتها الأصلية، نطقها بالحروف العربية، المعنى بالعربية (كلمة أو كلمتان)، جملة مثال قصيرة بالأصل، ترجمة الجملة بالعربية. بدون أي نص آخر.`,{cache:false});
    const ok=(Array.isArray(a)?a:[]).filter(x=>Array.isArray(x)&&x.length>=5).map(x=>x.slice(0,5).map(String));
    if(ok.length){i=words().length;L[lang].w.push(...ok)}
  }catch(e){}
  flipped=false;learn();
}
function numsView(){
  const g=NUM[lang];
  view.innerHTML=`<div class="meta"><span>الأرقام من 1 إلى 100</span><span>اضغط للاستماع</span></div><div class="nums">${g.map((x,k)=>`<button class="num" data-k="${k}"><span class="n">${k+1}</span><span class="nw">${x[0]}</span><span class="np">${x[1]}</span></button>`).join("")}</div>`;
  view.querySelectorAll(".num").forEach(b=>b.onclick=()=>speak(g[b.dataset.k][0]));
}
const cls=c=>{const x=c.charCodeAt(0);if(x>=0x600&&x<=0x6FF)return"ar-SA";if(x>=0xAC00&&x<=0xD7AF||x>=0x1100&&x<=0x11FF)return"ko-KR";if(x>=0x3040&&x<=0x30FF)return"ja-JP";if(x>=0x4E00&&x<=0x9FFF)return lang==="ja"?"ja-JP":"zh-CN";if(/[A-Za-zÀ-ÿ]/.test(c))return["fr","es"].includes(lang)?L[lang].v:"en-US";return null};
function speakMixed(t){
  if(!("speechSynthesis" in window))return;
  t=t.replace(/[*_#`>~]/g,"").replace(/\p{Extended_Pictographic}/gu,"").slice(0,700);
  const out=[];let cur=null,buf="";
  for(const ch of t){const c=cls(ch)||cur;if(c!==cur&&buf.trim()){out.push([cur||"ar-SA",buf]);buf=""}cur=c;buf+=ch}
  if(buf.trim())out.push([cur||"ar-SA",buf]);
  speechSynthesis.cancel();
  out.forEach(([l,s])=>{const u=new SpeechSynthesisUtterance(s);u.lang=l;u.rate=.9;speechSynthesis.speak(u)});
}
let micAr=true,listening=false,rec=null,dict=null,voiceOn=true,base="",srBad=false;
function setL(on){listening=on;const b=$("#mic");if(b){b.textContent=on?"⏹":"🎤";b.setAttribute("aria-label",on?"إيقاف":"تحدّث")}}
function micMsg(t){const x=$("#inp");if(x)x.placeholder=t}
function micDone(){setL(false);const x=$("#inp");if(x&&x.value.trim()){const v=x.value;x.value="";send(v)}}
function toggleMic(){
  if(listening){try{rec?rec.stop():dict&&dict.stop()}catch(e){}return}
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition,x=$("#inp");
  speechSynthesis.cancel();rec=null;
  if(SR&&!srBad){
    rec=new SR();rec.lang=micAr?"ar-SA":L[lang].v;rec.interimResults=true;
    rec.onresult=e=>{x.value=[...e.results].map(r=>r[0].transcript).join(" ")};
    rec.onerror=e=>{if(["not-allowed","service-not-allowed"].includes(e.error)){srBad=true;micMsg(dict?"اضغط 🎤 مرة أخرى":"لم يُسمح بالميكروفون")}else micMsg("لم أسمعك، حاول مجددًا")};
    rec.onend=micDone;
    try{rec.start();setL(true)}catch(e){srBad=true;rec=null}
  }else if(dict){x.value="";base="";dict.start().then(()=>setL(true)).catch(()=>micMsg("لم يُسمح بالميكروفون"))}
  else micMsg("الميكروفون غير مدعوم في هذا المتصفح");
}
try{window.claude.use("dictation").then(d=>{dict=d;if(!d)return;
  d.onPartial(({text})=>{const x=$("#inp");if(x)x.value=base+text});
  d.onFinal(({text})=>{base+=text+" ";const x=$("#inp");if(x)x.value=base});
  d.onState(({state})=>{if(state==="listening")setL(true);else if(state==="idle"&&listening){base="";micDone()}})}).catch(()=>{})}catch(e){}
function render(){chips();({learn,nums:numsView,quiz,review,chat:chatView})[tab]()}
$("#langs").onclick=e=>{const b=e.target.closest(".chip");if(!b)return;lang=b.dataset.l;i=0;flipped=false;q=null;render()};
document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{
  tab=b.dataset.t;document.querySelectorAll(".tab").forEach(x=>x.setAttribute("aria-selected",x===b));render()});
render();
if("serviceWorker" in navigator)navigator.serviceWorker.register("/sw.js");
</script>
